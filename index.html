    <script>
      (function () {
        try {
          if (typeof window !== 'undefined') {
            // Suppress uncaught error if an external script tries to assign to read-only fetch
            window.addEventListener('error', function (event) {
              if (
                event &&
                event.message &&
                typeof event.message === 'string' &&
                event.message.indexOf('fetch') !== -1 &&
                event.message.indexOf('only a getter') !== -1
              ) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return true;
              }
            });

            var _origFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
            var _activeFetch = _origFetch;

            // 1. Check Window.prototype
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && !protoDesc.set && protoDesc.configurable) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function () {
                    return _activeFetch || _origFetch;
                  },
                  set: function (val) {
                    _activeFetch = val;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            }

            // 2. Ensure window instance has writable/configurable fetch accessor
            var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!winDesc || (!winDesc.set && !winDesc.writable && winDesc.configurable !== false)) {
              Object.defineProperty(window, 'fetch', {
                get: function () {
                  return _activeFetch || _origFetch;
                },
                set: function (val) {
                  _activeFetch = val;
                },
                configurable: true,
                enumerable: true,
              });
            }
          }
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>
